<script>
    let googleClientId = localStorage.getItem('user_google_client_id') || '';
    let accessToken = null;
    let currentUserProfile = null;
    let liveEmails = [];

    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    let currentYear = new Date().getFullYear();
    let currentMonthIdx = new Date().getMonth();
    let selectedDate = new Date().toISOString().split('T')[0];
    let isFilterByDateActive = false;
    let currentView = 'unread';
    let activeSortKey = 'newest';
    let calendarEvents = JSON.parse(localStorage.getItem('user_calendar_events')) || [];

    function openClientIdModal() {
      document.getElementById('modal-client-id-input').value = googleClientId;
      document.getElementById('client-id-modal').classList.remove('hidden');
    }

    function closeClientIdModal() {
      document.getElementById('client-id-modal').classList.add('hidden');
    }

    function saveClientIdFromModal() {
      const rawId = document.getElementById('modal-client-id-input').value.trim();
      const match = rawId.match(/\d+-[a-z0-9]+\.apps\.googleusercontent\.com/i);
      googleClientId = match ? match[0] : rawId;

      if (!googleClientId) {
        alert("Please enter a valid Google OAuth Client ID.");
        return;
      }

      localStorage.setItem('user_google_client_id', googleClientId);
      closeClientIdModal();
      alert("Client ID saved! Click 'Sign In with Google' to load your Gmail inbox.");
    }

    function loginWithGoogle() {
      if (!googleClientId) {
        openClientIdModal();
        return;
      }

      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: googleClientId,
        scope: 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
        callback: async (response) => {
          if (response.error) {
            alert(`Authentication failed: ${response.error}`);
            return;
          }
          accessToken = response.access_token;
          await fetchUserProfile();
          await fetchGmailInbox();
        },
        error_callback: (err) => {
          alert(`Google popup closed or blocked (${err.type}).`);
        }
      });

      tokenClient.requestAccessToken();
    }

    async function fetchUserProfile() {
      try {
        const res = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        currentUserProfile = await res.json();
        
        const userBar = document.getElementById('user-profile-bar');
        userBar.innerHTML = `
          <div class="flex items-center space-x-2 bg-indigo-900/50 px-3 py-1 rounded-lg border border-indigo-600 text-xs">
            <img src="${currentUserProfile.picture}" class="w-6 h-6 rounded-full border border-white" alt="Avatar"/>
            <span class="font-bold text-white">${currentUserProfile.name}</span>
          </div>
        `;
      } catch (err) {
        console.error('User Profile Fetch Error:', err);
      }
    }

    async function fetchGmailInbox() {
      const container = document.getElementById('main-feed-container');
      container.innerHTML = `<div class="p-12 text-center text-slate-500 text-xs">Sorting inbox emails and isolating spam/junk...</div>`;

      try {
        const res = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=40&q=in:inbox OR in:spam OR in:trash', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const data = await res.json();

        if (data.error) {
          throw new Error(`${data.error.code}: ${data.error.message}`);
        }

        if (!data.messages || data.messages.length === 0) {
          container.innerHTML = `<div class="p-12 text-center text-slate-400 text-xs">No emails found in this Gmail account.</div>`;
          return;
        }

        const emailPromises = data.messages.map(async (msg) => {
          const detailRes = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${msg.id}`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          return await detailRes.json();
        });

        const fullMessages = await Promise.all(emailPromises);
        
        liveEmails = fullMessages.map((msg) => {
          const headers = msg.payload.headers || [];
          const subjectHeader = headers.find(h => h.name.toLowerCase() === 'subject');
          const fromHeader = headers.find(h => h.name.toLowerCase() === 'from');
          const dateHeader = headers.find(h => h.name.toLowerCase() === 'date');

          const topic = subjectHeader ? subjectHeader.value : '(No Subject)';
          const snippet = msg.snippet || 'No text snippet available.';
          const sender = fromHeader ? fromHeader.value : 'Unknown Sender';
          const msgDate = dateHeader ? new Date(dateHeader.value) : new Date();

          const isUnread = msg.labelIds ? msg.labelIds.includes('UNREAD') : false;
          const isStarred = msg.labelIds ? msg.labelIds.includes('STARRED') : false;
          
          // STRICT SPAM & JUNK CLASSIFIER
          const isExplicitSpam = msg.labelIds ? (msg.labelIds.includes('SPAM') || msg.labelIds.includes('TRASH')) : false;
          const junkKeywords = [
            'unsubscribe', 'discount', '% off', 'sale', 'newsletter', 'no-reply', 'noreply', 
            'promotions', 'deals', 'marketing', 'subscription', 'special offer', 'claim', 
            'winner', 'verify your account', 'crypto', 'digest', 'order status', 'receipt'
          ];
          
          const isJunkText = junkKeywords.some(kw => 
            topic.toLowerCase().includes(kw) || 
            snippet.toLowerCase().includes(kw) || 
            sender.toLowerCase().includes(kw)
          );
          
          const isJunk = isExplicitSpam || isJunkText;

          // ACTIONABLE / MEETING DETECTOR
          const actionKeywords = ['meeting', 'schedule', 'invite', 'zoom', 'call', 'urgent', 'action required', 'due date', 'calendar', 'sync'];
          const isActionable = !isJunk && actionKeywords.some(kw => topic.toLowerCase().includes(kw) || snippet.toLowerCase().includes(kw));

          return {
            id: msg.id,
            sender: sender,
            topic: topic,
            snippet: snippet,
            starred: isStarred,
            status: isUnread ? 'unread' : 'read',
            isJunk: isJunk,
            isActionable: isActionable,
            dateObj: msgDate,
            dateStr: msgDate.toISOString().split('T')[0],
            displayDate: msgDate.toLocaleDateString()
          };
        });

        renderFeed();
      } catch (err) {
        console.error('Gmail API Error:', err);
        container.innerHTML = `<div class="p-12 text-center text-red-500 text-xs">Failed to load Gmail messages: ${err.message}</div>`;
      }
    }

    function renderFeed() {
      const container = document.getElementById('main-feed-container');
      container.innerHTML = '';

      if (liveEmails.length === 0) {
        container.innerHTML = `<div class="p-12 text-center text-slate-400 text-xs">No emails available. Sign in with Google to view inbox messages.</div>`;
        return;
      }

      let filteredList = [...liveEmails];

      // Folder Filtering Logic
      if (currentView === 'unread') {
        filteredList = filteredList.filter(e => e.status === 'unread' && !e.isJunk);
      } else if (currentView === 'starred') {
        filteredList = filteredList.filter(e => e.starred && !e.isJunk);
      } else if (currentView === 'actionable') {
        filteredList = filteredList.filter(e => e.isActionable && !e.isJunk);
      } else if (currentView === 'trash') {
        filteredList = filteredList.filter(e => e.isJunk);
      } else if (currentView === 'full-inbox') {
        // Full Inbox view shows EVERYTHING (including junk/spam)
        filteredList = [...liveEmails];
      }

      // Filter by Calendar Date
      if (isFilterByDateActive) {
        filteredList = filteredList.filter(e => e.dateStr === selectedDate);
      }

      // Apply Sorting
      if (activeSortKey === 'newest') {
        filteredList.sort((a, b) => b.dateObj - a.dateObj);
      } else if (activeSortKey === 'oldest') {
        filteredList.sort((a, b) => a.dateObj - b.dateObj);
      } else if (activeSortKey === 'sender') {
        filteredList.sort((a, b) => a.sender.localeCompare(b.sender));
      }

      // Update Sidebar Badges
      document.getElementById('unread-count-badge').innerText = liveEmails.filter(e => e.status === 'unread' && !e.isJunk).length;
      document.getElementById('starred-count-badge').innerText = liveEmails.filter(e => e.starred && !e.isJunk).length;
      document.getElementById('actionable-count-badge').innerText = liveEmails.filter(e => e.isActionable && !e.isJunk).length;
      document.getElementById('trash-count').innerText = liveEmails.filter(e => e.isJunk).length;

      if (filteredList.length === 0) {
        container.innerHTML = `<div class="p-12 text-center text-slate-400 text-xs">No messages matching this view or filter.</div>`;
        return;
      }

      filteredList.forEach((email) => {
        const card = document.createElement('div');
        card.className = "p-4 bg-white border border-slate-200 rounded-lg hover:border-indigo-400 cursor-pointer transition flex flex-col space-y-1 shadow-sm";
        card.onclick = () => openEmailModal(email.id);
        card.innerHTML = `
          <div class="flex items-center justify-between text-xs font-bold text-slate-800">
            <span class="truncate max-w-[220px]">${email.sender}</span>
            <span class="text-[10px] text-slate-400 font-mono">${email.displayDate}</span>
          </div>
          <div class="text-xs text-indigo-700 font-semibold truncate flex items-center gap-1.5">
            ${email.isJunk ? '<span class="bg-red-100 text-red-800 text-[9px] px-1.5 py-0.5 rounded font-bold">Junk</span>' : ''}
            ${email.isActionable ? '<span class="bg-amber-100 text-amber-800 text-[9px] px-1.5 py-0.5 rounded font-bold">Action</span>' : ''}
            ${email.topic}
          </div>
          <div class="text-[11px] text-slate-500 line-clamp-1">${email.snippet}</div>
        `;
        container.appendChild(card);
      });

      lucide.createIcons();
    }

    function openEmailModal(emailId) {
      const email = liveEmails.find(e => e.id === emailId);
      if (!email) return;

      document.getElementById('email-detail-subject').innerText = email.topic;
      document.getElementById('email-detail-sender').innerText = email.sender;
      document.getElementById('email-detail-date').innerText = email.displayDate;
      document.getElementById('email-detail-body').innerText = email.snippet;

      const tagContainer = document.getElementById('email-detail-tags');
      tagContainer.innerHTML = '';
      if (email.isJunk) {
        tagContainer.innerHTML += `<span class="bg-red-100 text-red-800 text-[10px] px-2 py-0.5 rounded font-bold">Junk / Spam</span>`;
      }
      if (email.isActionable) {
        tagContainer.innerHTML += `<span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded font-bold">Actionable / Meeting</span>`;
      }

      document.getElementById('email-detail-modal').classList.remove('hidden');
    }

    function closeEmailModal() {
      document.getElementById('email-detail-modal').classList.add('hidden');
    }

    function switchView(viewName) {
      currentView = viewName;
      document.getElementById('main-view-title').innerText = 
        viewName === 'unread' ? 'Priority Unread Inbox' : 
        viewName === 'starred' ? 'Starred Queue' : 
        viewName === 'actionable' ? 'Actionable / Meetings' : 
        viewName === 'trash' ? 'Spam & Junk Filter' : 'All Messages';
      renderFeed();
    }

    function resetDateFilter() {
      isFilterByDateActive = false;
      document.getElementById('active-date-label').innerText = 'All Dates';
      renderCalendar();
      renderFeed();
    }

    function changeMonth(delta) {
      currentMonthIdx += delta;
      if (currentMonthIdx > 11) {
        currentMonthIdx = 0;
        currentYear++;
      } else if (currentMonthIdx < 0) {
        currentMonthIdx = 11;
        currentYear--;
      }
      document.getElementById('calendar-month-title').innerText = `${monthNames[currentMonthIdx]} ${currentYear}`;
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-days-grid');
      if (!grid) return;
      grid.innerHTML = '';
      const firstDayOffset = new Date(currentYear, currentMonthIdx, 1).getDay();
      const totalDays = new Date(currentYear, currentMonthIdx + 1, 0).getDate();

      for (let o = 0; o < firstDayOffset; o++) grid.appendChild(document.createElement('div'));

      for (let day = 1; day <= totalDays; day++) {
        const monthStr = (currentMonthIdx + 1) < 10 ? '0' + (currentMonthIdx + 1) : (currentMonthIdx + 1);
        const dayStr = day < 10 ? '0' + day : day;
        const dateStr = `${currentYear}-${monthStr}-${dayStr}`;

        const btn = document.createElement('button');
        btn.className = `p-1 rounded-lg transition font-semibold text-xs h-7 hover:bg-slate-100 ${selectedDate === dateStr && isFilterByDateActive ? 'bg-indigo-600 text-white font-bold' : 'text-slate-600'}`;
        btn.innerText = day;
        btn.onclick = () => {
          selectedDate = dateStr;
          isFilterByDateActive = true;
          document.getElementById('active-date-label').innerText = selectedDate;
          renderCalendar();
          renderFeed();
          renderScheduleList();
        };
        grid.appendChild(btn);
      }
    }

    function changeSortOrder(val) {
      activeSortKey = val;
      renderFeed();
    }

    function openAddEventModal() {
      document.getElementById('event-date-input').value = selectedDate;
      document.getElementById('add-event-modal').classList.remove('hidden');
    }

    function closeAddEventModal() {
      document.getElementById('add-event-modal').classList.add('hidden');
    }

    function handleCreateEvent(e) {
      e.preventDefault();
      const title = document.getElementById('event-title-input').value.trim();
      const date = document.getElementById('event-date-input').value;
      const time = document.getElementById('event-time-input').value;
      const notes = document.getElementById('event-notes-input').value.trim();

      if (!title || !date) return;

      const newEvent = { id: Date.now(), title, date, time, notes };
      calendarEvents.push(newEvent);
      localStorage.setItem('user_calendar_events', JSON.stringify(calendarEvents));

      document.getElementById('event-title-input').value = '';
      document.getElementById('event-notes-input').value = '';
      closeAddEventModal();
      
      renderScheduleList();
    }

    function renderScheduleList() {
      const container = document.getElementById('integrated-schedule-list');
      const countBadge = document.getElementById('event-count-badge');
      const dateHeading = document.getElementById('schedule-date-heading');

      dateHeading.innerText = selectedDate;
      
      const dayEvents = calendarEvents.filter(ev => ev.date === selectedDate);
      countBadge.innerText = `${dayEvents.length} Events`;
      container.innerHTML = '';

      if (dayEvents.length === 0) {
        container.innerHTML = `<div class="text-[11px] text-indigo-300 italic p-2">No scheduled events for this date.</div>`;
        return;
      }

      dayEvents.forEach(ev => {
        const item = document.createElement('div');
        item.className = "bg-indigo-900/60 p-2 rounded-lg border border-indigo-700/50 flex justify-between items-center text-xs";
        item.innerHTML = `
          <div>
            <div class="font-bold text-white">${ev.title}</div>
            <div class="text-[10px] text-amber-300 font-mono">${ev.time}</div>
          </div>
          <button onclick="deleteEvent(${ev.id})" class="text-indigo-400 hover:text-red-400 p-1">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        `;
        container.appendChild(item);
      });

      lucide.createIcons();
    }

    function deleteEvent(id) {
      calendarEvents = calendarEvents.filter(ev => ev.id !== id);
      localStorage.setItem('user_calendar_events', JSON.stringify(calendarEvents));
      renderScheduleList();
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('calendar-month-title').innerText = `${monthNames[currentMonthIdx]} ${currentYear}`;
      renderCalendar();
      renderScheduleList();
      lucide.createIcons();
    });
  </script>
